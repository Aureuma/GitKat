name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> .artifacts/cargo-target
      - name: Rustfmt
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> .artifacts/cargo-target
      - name: Run tests
        run: cargo test --workspace --all-targets
      - name: Build docs
        run: |
          cargo install mdbook --locked
          mdbook build

  rewrite-verify:
    name: Verify (${{ matrix.case }})
    runs-on: ubuntu-latest
    needs: [tests, lint]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - case: identity
            args: --ci
          - case: blob
            args: --ci --with-blob
          - case: regex
            args: --ci --with-blob --with-regex
          - case: bfg
            args: --ci --with-blob --with-bfg
            needs_java: true
            needs_bfg: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> .artifacts/cargo-target
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        if: matrix.needs_java
        with:
          distribution: temurin
          java-version: "17"
      - name: Install git-filter-repo
        run: python -m pip install --upgrade pip git-filter-repo
      - name: Download BFG
        if: matrix.needs_bfg
        run: |
          mkdir -p "${{ runner.temp }}/bfg"
          curl -sSL -o "${{ runner.temp }}/bfg/bfg.jar" \
            https://repo1.maven.org/maven2/com/madgag/bfg/1.14.0/bfg-1.14.0.jar
      - name: Verify rewrite equivalence
        env:
          BFG_JAR: ${{ runner.temp }}/bfg/bfg.jar
        run: cargo run -p gitkat -- verify-rewrite ${{ matrix.args }}
