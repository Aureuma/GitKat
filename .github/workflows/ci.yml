name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Tests
        run: cargo test --workspace
      - name: Build docs
        run: |
          cargo install mdbook
          mdbook build

  rewrite-verify:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install git-filter-repo
        run: sudo apt-get update && sudo apt-get install -y git-filter-repo
      - name: Verify rewrite equivalence
        run: cargo run -p gitkat -- verify-rewrite --ci --with-blob
