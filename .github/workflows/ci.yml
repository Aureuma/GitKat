name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv pip install -e '.[dev]'
      - name: Lint
        run: uv run ruff check src tests
      - name: Tests
        run: uv run pytest --cov=gitkit --cov-report=term-missing
      - name: Docs
        run: uv run mkdocs build
