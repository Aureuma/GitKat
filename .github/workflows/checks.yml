name: Checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --workspace
      - name: Build docs
        run: |
          cargo install mdbook --locked
          mdbook build

  rewrite-verify:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install git-filter-repo
        run: python -m pip install --upgrade pip git-filter-repo
      - name: Verify rewrite equivalence
        run: cargo run -p gitkat -- verify-rewrite --ci --with-blob
