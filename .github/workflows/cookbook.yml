name: Cookbook

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/cookbook/**
      - scripts/run_cookbook.sh
      - .github/workflows/cookbook.yml

concurrency:
  group: cookbook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always
  GIT_TERMINAL_PROMPT: "0"
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  cookbook:
    name: Cookbook (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: [group1, group2, group3, group4]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> .artifacts/cargo-target
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install git-filter-repo
        run: python -m pip install --upgrade pip git-filter-repo
      - name: Build GitKat
        run: cargo build --release -p gitkat
      - name: Run cookbook recipes
        env:
          GK_BIN: ${{ github.workspace }}/.artifacts/cargo-target/release/gk
          WORK_DIR: ${{ runner.temp }}/gitkat-cookbook
        run: scripts/run_cookbook.sh ${{ matrix.group }}
