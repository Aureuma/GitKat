name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  build-assets:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            ext: tar.gz
            use_cross: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ext: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up cross
        if: matrix.use_cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release -p gitkat --target ${{ matrix.target }}
          else
            cargo build --release -p gitkat --target ${{ matrix.target }}
          fi

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --release -p gitkat --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/gk"
          ARCHIVE="dist/gitkat-v${VERSION}-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C "$(dirname "$BIN")" gk

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bin = "target/${{ matrix.target }}/release/gk.exe"
          $archive = Join-Path $pwd ("dist/gitkat-v$version-${{ matrix.target }}.zip")
          $binDir = Split-Path -Parent $bin
          Push-Location $binDir
          Compress-Archive -Path gk.exe -DestinationPath $archive
          Pop-Location

      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  publish-crates:
    runs-on: ubuntu-latest
    needs: build-assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Publish rewrite crate
        run: cargo publish -p gitkat-rewrite
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.ACTIONS_RELEASE_TOKEN }}
      - name: Publish CLI crate
        run: cargo publish -p gitkat
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.ACTIONS_RELEASE_TOKEN }}

  publish-pypi:
    runs-on: ubuntu-latest
    needs: build-assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist/wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    runs-on: ubuntu-latest
    needs: build-assets
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
