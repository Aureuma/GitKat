[package]
name = "gitkat-rewrite"
version = "0.5.8"
edition = "2021"
rust-version = "1.94"
description = "GitKat git history rewrite engine built on gitoxide"
license = "MIT"
repository = "https://github.com/Aureuma/GitKat"
readme = "../../README.md"

[lib]
name = "gitkat_rewrite"
path = "src/lib.rs"

[[bin]]
name = "gitkat-rewrite"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
gix = { version = "0.81", features = ["revision", "tree-editor"] }
gix-object = "0.58"
globset = "0.4"
regex = "1.10"

[dev-dependencies]
tempfile = "3.10"
